name: Publish reviewed status release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gateway-status-reviewed
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify approved bytes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='f577a194386459d5233668cd1043d6f661c10dc4bb282ad995cc61784bc50fb0'
          exec(compile(data,'reviewed-reconstruction','exec'))
          PY
      - name: Commit reviewed release branch
        run: |
          git config user.name 'c3irohbis'
          git config user.email 'c3irohbis@users.noreply.github.com'
          git switch -c gateway-status-reviewed-release
          git commit -m 'Publish reviewed generation status and safe automatic reload'
          git push origin HEAD:refs/heads/gateway-status-reviewed-release
