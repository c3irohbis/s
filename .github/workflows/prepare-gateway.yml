name: Prepare reviewed gateway release
on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact current main commit
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gateway-g4-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.expected_main
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gateway-g4-staging
          path: staging-input
          persist-credentials: false
      - name: Verify pinned inputs and programs
        run: |
          echo '84f3b47fb77d08071a553b30c837cc4245e0f0f7e7ba697b4d4a19406c5b7a88  staging-input/source-input.json' | sha256sum --check --strict
          echo '297fb8f4788096ede22e1000ef3cda608da69666b1b5834cb7be61a306c72f1e  staging-input/deployment-record.json' | sha256sum --check --strict
          echo '64b33ad913376a61a8911acb3d29d931f3cb7ad223105db8070dbf99177a9c24  staging-input/reproduce_release.py' | sha256sum --check --strict
          echo '27b740efab3989ecca6c41edb940a20a1ee339dee1c63686db10730050c4feb1  staging-input/apply_release.py' | sha256sum --check --strict
      - name: Install hash-pinned build parsers
        run: |
          cat > /tmp/release-requirements.txt <<'PYREQ'
          beautifulsoup4==4.15.0 --hash=sha256:d6f88de62e1d4e38ecb1077eb9724cd0eff29d2a08ca16a401e9b9e93f117cf9
          soupsieve==2.3.1 --hash=sha256:1a3cca2617c6b38c0343ed661b1fa5de5637f257d4fe22bd9f1338010a1efefb
          typing_extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          tinycss2==1.5.1 --hash=sha256:3415ba0f5839c062696996998176c4a3751d18b7edaaeeb658c9ce21ec150661
          webencodings==0.5.1 --hash=sha256:a0af1213f3c2226497a97e2b3aa01a7e4bee4f403f95be16fc9acd2947514a78
          PYREQ
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r /tmp/release-requirements.txt
          mkdir -p /tmp/release-parser
          cat > /tmp/release-parser/package.json <<'NODEJSON'
          {
            "dependencies": {
              "acorn": "8.19.0"
            }
          }
          NODEJSON
          cat > /tmp/release-parser/package-lock.json <<'NODEJSON'
          {
            "name": "parser-lock",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "dependencies": {
                  "acorn": "8.19.0"
                }
              },
              "node_modules/acorn": {
                "version": "8.19.0",
                "resolved": "https://registry.npmjs.org/acorn/-/acorn-8.19.0.tgz",
                "integrity": "sha512-oJlA3XiRm7Cyk6qFD2Jn8ak9B7jSy0qy00ADO3+8dpT0LSjFihQYv4C02LFCSYJV3Q37xYwwRy5m+IpIiUzqWw==",
                "license": "MIT",
                "bin": {
                  "acorn": "bin/acorn"
                },
                "engines": {
                  "node": ">=0.4.0"
                }
              }
            }
          }
          NODEJSON
          npm ci --prefix /tmp/release-parser --ignore-scripts --no-audit --no-fund
      - name: Reproduce and validate release branch only
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          RELEASE_ACORN: /tmp/release-parser/node_modules/acorn
          SOURCE_SHA256: 84f3b47fb77d08071a553b30c837cc4245e0f0f7e7ba697b4d4a19406c5b7a88
          RECORD_SHA256: 297fb8f4788096ede22e1000ef3cda608da69666b1b5834cb7be61a306c72f1e
          APPLY_SHA256: 27b740efab3989ecca6c41edb940a20a1ee339dee1c63686db10730050c4feb1
        run: python3 staging-input/reproduce_release.py staging-input/source-input.json staging-input/deployment-record.json staging-input/apply_release.py
